[project]
name = "uaibot"
version = "1.5.0"
description = "UAIBOT — juego de grilla 2D para OFIRCA 2026, hecho con arcade"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arcade==3.3.3",
    "attrs==26.1.0",
    "cffi==2.0.0",
    "pillow==11.3.0",
    "pycparser==3.0",
    "pyglet==2.1.14",
    "pymunk==6.9.0",
    "pytiled-parser==2.2.9",
    "typing-extensions==4.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
